name: pharma-traceability-platform
services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${DOCUMENT_CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped
  minio-init:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint: ['/bin/sh', '/init-storage.sh']
    volumes:
      - ./init-storage.sh:/init-storage.sh:ro
    restart: 'no'
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    user: root
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/data']
    ports:
      - '127.0.0.1:${DYNAMODB_PORT:-8000}:8000'
    volumes:
      - dynamodb_data:/data
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/opt/kafka/bin/kafka-topics.sh']
    command:
      [
        '--bootstrap-server',
        'kafka:29092',
        '--create',
        '--if-not-exists',
        '--topic',
        'pharma.domain-events.v1',
        '--partitions',
        '6',
        '--replication-factor',
        '1',
        '--config',
        'min.insync.replicas=1',
        '--config',
        'retention.ms=604800000',
      ]
    restart: 'no'
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/docker/.env}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD:?Set ORGANIZATION_DB_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD}
      BATCH_DB_PASSWORD: ${BATCH_DB_PASSWORD:?Set BATCH_DB_PASSWORD}
      RECALL_DB_PASSWORD: ${RECALL_DB_PASSWORD:?Set RECALL_DB_PASSWORD}
      SHIPMENT_DB_PASSWORD: ${SHIPMENT_DB_PASSWORD:?Set SHIPMENT_DB_PASSWORD}
      AGGREGATION_DB_PASSWORD: ${AGGREGATION_DB_PASSWORD:?Set AGGREGATION_DB_PASSWORD}
      SERIALIZATION_DB_PASSWORD: ${SERIALIZATION_DB_PASSWORD:?Set SERIALIZATION_DB_PASSWORD}
      TRACEABILITY_DB_PASSWORD: ${TRACEABILITY_DB_PASSWORD:?Set TRACEABILITY_DB_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - ./init-organization.sh:/docker-entrypoint-initdb.d/02-organization.sh:ro
      - ./init-product.sh:/docker-entrypoint-initdb.d/03-product.sh:ro
      - ./init-batch.sh:/docker-entrypoint-initdb.d/04-batch.sh:ro
      - ./init-serialization.sh:/docker-entrypoint-initdb.d/05-serialization.sh:ro
      - ./init-traceability.sh:/docker-entrypoint-initdb.d/07-traceability.sh:ro
      - ./init-aggregation.sh:/docker-entrypoint-initdb.d/06-aggregation.sh:ro
      - ./init-recall.sh:/docker-entrypoint-initdb.d/09-recall.sh:ro
      - ./init-shipment.sh:/docker-entrypoint-initdb.d/08-shipment.sh:ro
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth_owner -d auth']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  minio_data:
  dynamodb_data:
  redis_data:
  kafka_data:
  auth_postgres_data:
